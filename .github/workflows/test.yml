name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: deps
      run: sudo apt update && sudo add-apt-repository -y ppa:d-apt/ppa && sudo apt update && sudo apt install -y gcc make pkg-config golang-go zig gnat nim rustc lua5.4 perl libgtk-3-dev valac dmd-compiler dub
    - name: make
      run: make

