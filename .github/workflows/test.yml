name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: deps
      run: sudo apt update && sudo apt install -y gcc make pkg-config golang-go gnat nim rustc lua5.4 perl libgtk-3-dev valac wget && wget https://github.com/dariogriffo/zig-debian/releases/download/0.17.0%2B2/zig-stable_0.17.0-2.griffo_amd64.deb -O zig.deb && D_VERSION=$(wget -qO - http://downloads.dlang.org/releases/LATEST) && wget -qO dmd.deb http://downloads.dlang.org/releases/2.x/${D_VERSION}/dmd_${D_VERSION}-0_amd64.deb && sudo apt install -y ./dmd.deb && sudo apt install -y ./zig.deb && rm *.deb
    - name: make
      run: make

